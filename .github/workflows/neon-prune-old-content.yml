name: Neon prune old content (auto, storage-capped)

# Neon's free tier caps total project storage at 512MB. This project has
# repeatedly hit that cap (confirmed live: 0.52/0.5GB) -- scheduled pipeline
# runs keep scraping successfully even when they later fail at the
# enrichment step (missing GROQ_API_KEY, a separate issue), so storage
# keeps growing regardless. This workflow keeps it under control
# automatically: runs every 6 hours, checks the real DB size first, and
# ONLY deletes anything if it's actually over the threshold -- a normal
# run where storage is fine is a fast no-op.
#
# Policy (user-approved 2026-08-09):
#   - Threshold: prune when pg_database_size > 450MB (leaves headroom
#     under Neon's 512MB hard cap).
#   - Eligible: articles/youtube_videos with published_at older than 30
#     days.
#   - NEVER deleted: anything referenced by saved_items, regardless of
#     age -- a user's saved article is permanent, full stop.
#   - Bounded: deletes in batches of 200 oldest-eligible items, re-checks
#     size, repeats up to 10 batches (2000 items) per run, then stops even
#     if still over threshold -- next scheduled run continues. This caps
#     the worst case a single run can do if something is misconfigured.
#
# Deletes cascade manually (matching neon-delete-stale-accounts.yml's
# precedent): NO table has a real FK constraint to articles/youtube_videos
# (verified via information_schema against Neon) -- every dependent table
# uses the polymorphic (content_type, content_id) pattern with no DB-level
# enforcement, so orphans are only avoided by explicitly deleting from
# every one of them here.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report what WOULD be deleted, delete nothing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Pre-flight secret check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is empty. Aborting."
            exit 1
          fi

      - name: Check size and prune if needed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          REPORT=neon-prune-result.txt
          THRESHOLD_BYTES=$((450 * 1024 * 1024))
          BATCH_SIZE=200
          MAX_BATCHES=10

          echo "Neon prune old content — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          [ "$DRY_RUN" = "true" ] && echo "(DRY RUN — nothing will actually be deleted)" >> "$REPORT"
          echo "" >> "$REPORT"

          size_bytes() { psql "$DATABASE_URL" -tAc "SELECT pg_database_size(current_database());"; }

          before=$(size_bytes)
          echo "DB size: $(numfmt --to=iec "$before") ($before bytes) — threshold: 450 MiB" >> "$REPORT"

          if [ "$before" -le "$THRESHOLD_BYTES" ]; then
            echo "Under threshold, nothing to do." >> "$REPORT"
            cat "$REPORT"
            exit 0
          fi

          echo "" >> "$REPORT"
          echo "Over threshold — pruning oldest unsaved articles/videos (published_at < now() - 30 days)." >> "$REPORT"
          printf '%-8s %12s %12s\n' "batch" "deleted" "size_after" >> "$REPORT"

          # One statement per content_type per batch: pick the N oldest
          # eligible ids (old enough, not in saved_items), delete every
          # dependent row for them, then the content row itself.
          prune_batch() {
            content_type="$1"; table="$2"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v ct="$content_type" -v tbl="$table" -v n="$BATCH_SIZE" -c "
              CREATE TEMP TABLE IF NOT EXISTS _prune_ids (id bigint);
              TRUNCATE _prune_ids;
              INSERT INTO _prune_ids
                SELECT c.id FROM $table c
                WHERE c.published_at < now() - interval '30 days'
                  AND NOT EXISTS (
                    SELECT 1 FROM saved_items si
                    WHERE si.content_type = '$content_type' AND si.content_id = c.id
                  )
                ORDER BY c.published_at ASC
                LIMIT $BATCH_SIZE;

              DELETE FROM content_chunks WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM rag_chunks WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM embeddings WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM content_enrichment WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM content_scores WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM content_topics WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM content_entities WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM content_cluster_members WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM digest_click_tokens WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM user_rankings WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM user_events WHERE content_type='$content_type' AND content_id IN (SELECT id FROM _prune_ids);
              DELETE FROM $table WHERE id IN (SELECT id FROM _prune_ids);
            "
          }

          prune_batch_dry() {
            content_type="$1"; table="$2"
            psql "$DATABASE_URL" -tAc "
              SELECT count(*) FROM $table c
              WHERE c.published_at < now() - interval '30 days'
                AND NOT EXISTS (
                  SELECT 1 FROM saved_items si
                  WHERE si.content_type = '$content_type' AND si.content_id = c.id
                )
              ORDER BY c.published_at ASC
              LIMIT $BATCH_SIZE;
            "
          }

          if [ "$DRY_RUN" = "true" ]; then
            for i in $(seq 1 3); do
              a=$(prune_batch_dry article articles)
              v=$(prune_batch_dry youtube_video youtube_videos)
              printf '%-8s articles=%-6s videos=%-6s (dry run, not deleted)\n' "$i" "$a" "$v" >> "$REPORT"
            done
            cat "$REPORT"
            echo "" >> "$REPORT"
            echo "Committing result..."
          else
            batch=0
            current=$before
            while [ "$current" -gt "$THRESHOLD_BYTES" ] && [ "$batch" -lt "$MAX_BATCHES" ]; do
              batch=$((batch + 1))
              before_articles=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM articles;")
              before_videos=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM youtube_videos;")
              prune_batch article articles
              prune_batch youtube_video youtube_videos
              after_articles=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM articles;")
              after_videos=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM youtube_videos;")
              deleted=$(( (before_articles - after_articles) + (before_videos - after_videos) ))
              current=$(size_bytes)
              printf '%-8s %12s %12s\n' "$batch" "$deleted" "$(numfmt --to=iec "$current")" | tee -a "$REPORT"
              if [ "$deleted" -eq 0 ]; then
                echo "Nothing left eligible for deletion (everything old enough is either already pruned or protected by saved_items) — stopping early." >> "$REPORT"
                break
              fi
            done
          fi

          echo "" >> "$REPORT"
          after=$(size_bytes)
          echo "DB size after: $(numfmt --to=iec "$after") ($after bytes)" >> "$REPORT"
          if [ "$after" -gt "$THRESHOLD_BYTES" ] && [ "$DRY_RUN" != "true" ]; then
            echo "STILL OVER THRESHOLD after $MAX_BATCHES batches — will continue on the next scheduled run (every 6h). If this persists, the age cutoff or batch size may need adjusting." >> "$REPORT"
          fi
          echo "Done." >> "$REPORT"

      - name: Commit result to a run-unique branch
        if: always()
        run: |
          git config user.name "neon-prune-bot"
          git config user.email "actions@github.com"
          if [ -f neon-prune-result.txt ]; then
            git add neon-prune-result.txt
            git commit -m "Neon prune result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/neon-prune-result-${{ github.run_id }}
          else
            echo "No result file produced."
          fi
