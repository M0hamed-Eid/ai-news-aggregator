name: Neon delete stale test accounts

# Deletes 5 confirmed stale/test accounts from Neon, identified during the
# reconciliation audit as test artifacts (not real users): ids 3,5,6,7,8 =
# test-multiuser@example.com, legacy-user-test@example.com,
# fresh-signup-test@example.com, wizard-view-test@example.com,
# wizard-source-persist-test@example.com. User-approved: "Yes, proceed
# with steps 1-3, and delete the test accounts too."
#
# CORRECTED after a live failure: the first version of this workflow
# assumed Django's FK constraints cascade at the database level. They
# don't -- `\d users` on Neon shows every referencing FK as plain
# `REFERENCES users(id) DEFERRABLE INITIALLY DEFERRED`, no
# `ON DELETE CASCADE` clause at all. Django's on_delete=CASCADE is
# emulated by the ORM (it issues its own DELETE statements in dependency
# order when you call instance.delete() through Django) -- it is NOT a
# database-level guarantee, so a raw SQL `DELETE FROM users` here (which
# doesn't go through Django's ORM at all) hits a foreign key violation
# instead of cascading. Fixed by deleting from every referencing table
# explicitly, in dependency order, verified against Neon's actual schema
# (every table's "Referenced by" section) rather than assumed:
#   chat_messages -> chat_conversations -> {django_admin_log, saved_items,
#   stripe_customers, terms_acceptances, user_events, user_follows,
#   users_groups, users_user_permissions} -> {user_digest_settings,
#   user_exclusions, user_interests, user_source_subscriptions} ->
#   user_profiles -> {digest_log, user_rankings, user_affinities,
#   digest_click_tokens, user_profile_vectors (no FK constraint at all,
#   pipeline-owned)} -> users.
#
# Every id is verified against its expected email immediately before
# deleting (fails closed, aborts everything, if even one doesn't match --
# this never proceeds on a partial/uncertain match).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: yes-delete-stale-accounts'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes-delete-stale-accounts" ]; then
            echo "Confirmation input did not match. Aborting without touching Neon."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install postgresql-client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Pre-flight secret check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is empty. Aborting."
            exit 1
          fi
          echo "DATABASE_URL length: ${#DATABASE_URL}"

      - name: Verify each id still matches its expected stale email
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          declare -A expected=(
            [3]="test-multiuser@example.com"
            [5]="legacy-user-test@example.com"
            [6]="fresh-signup-test@example.com"
            [7]="wizard-view-test@example.com"
            [8]="wizard-source-persist-test@example.com"
          )
          for id in "${!expected[@]}"; do
            actual="$(psql "$DATABASE_URL" -tAc "SELECT email FROM users WHERE id=$id;")"
            if [ "$actual" != "${expected[$id]}" ]; then
              echo "MISMATCH at id=$id: expected '${expected[$id]}', found '$actual'. Aborting -- refusing to delete anything." >&2
              exit 1
            fi
            echo "id=$id confirmed: $actual"
          done

      - name: Delete the 5 stale accounts and their orphan-risk rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          REPORT=neon-delete-stale-result.txt
          echo "Neon delete stale accounts — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          echo "" >> "$REPORT"

          echo "=== Users before ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "SELECT id, email FROM users ORDER BY id;" >> "$REPORT" 2>&1

          IDS="3,5,6,7,8"

          echo "" >> "$REPORT"
          echo "=== Deleting in dependency order (verified against Neon's actual FK graph, not assumed cascade) ===" >> "$REPORT"

          # Leaf: messages under any conversation belonging to these users.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM chat_messages WHERE conversation_id IN (SELECT id FROM chat_conversations WHERE user_id IN ($IDS));" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM chat_conversations WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1

          # Direct FK to users, real DB constraint, no further children.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM django_admin_log WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM saved_items WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM stripe_customers WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM terms_acceptances WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_events WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_follows WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM users_groups WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM users_user_permissions WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1

          # Children of user_profiles, via profile_id (must go before user_profiles itself).
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_digest_settings WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS));" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_exclusions WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS));" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_interests WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS));" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_source_subscriptions WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS));" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_profiles WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1

          # Pipeline-owned rows referencing user_id with no formal FK constraint at all.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM digest_log WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_rankings WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_affinities WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM digest_click_tokens WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM user_profile_vectors WHERE user_id IN ($IDS);" >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Deleting users rows (every referencing row above is now gone) ===" >> "$REPORT"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM users WHERE id IN ($IDS);" >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Users after ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "SELECT id, email FROM users ORDER BY id;" >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Orphan check: any remaining row anywhere referencing the deleted ids? (should be 0 rows) ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "
            SELECT 'chat_messages' t, count(*) FROM chat_messages WHERE conversation_id IN (SELECT id FROM chat_conversations WHERE user_id IN ($IDS))
            UNION ALL SELECT 'chat_conversations', count(*) FROM chat_conversations WHERE user_id IN ($IDS)
            UNION ALL SELECT 'django_admin_log', count(*) FROM django_admin_log WHERE user_id IN ($IDS)
            UNION ALL SELECT 'saved_items', count(*) FROM saved_items WHERE user_id IN ($IDS)
            UNION ALL SELECT 'terms_acceptances', count(*) FROM terms_acceptances WHERE user_id IN ($IDS)
            UNION ALL SELECT 'user_events', count(*) FROM user_events WHERE user_id IN ($IDS)
            UNION ALL SELECT 'user_follows', count(*) FROM user_follows WHERE user_id IN ($IDS)
            UNION ALL SELECT 'users_groups', count(*) FROM users_groups WHERE user_id IN ($IDS)
            UNION ALL SELECT 'users_user_permissions', count(*) FROM users_user_permissions WHERE user_id IN ($IDS)
            UNION ALL SELECT 'user_digest_settings', count(*) FROM user_digest_settings WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS))
            UNION ALL SELECT 'user_exclusions', count(*) FROM user_exclusions WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS))
            UNION ALL SELECT 'user_interests', count(*) FROM user_interests WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS))
            UNION ALL SELECT 'user_source_subscriptions', count(*) FROM user_source_subscriptions WHERE profile_id IN (SELECT id FROM user_profiles WHERE user_id IN ($IDS))
            UNION ALL SELECT 'user_profiles', count(*) FROM user_profiles WHERE user_id IN ($IDS)
            UNION ALL SELECT 'stripe_customers', count(*) FROM stripe_customers WHERE user_id IN ($IDS)
            UNION ALL SELECT 'digest_log', count(*) FROM digest_log WHERE user_id IN ($IDS)
            UNION ALL SELECT 'user_rankings', count(*) FROM user_rankings WHERE user_id IN ($IDS)
            UNION ALL SELECT 'user_affinities', count(*) FROM user_affinities WHERE user_id IN ($IDS)
            UNION ALL SELECT 'digest_click_tokens', count(*) FROM digest_click_tokens WHERE user_id IN ($IDS)
            UNION ALL SELECT 'user_profile_vectors', count(*) FROM user_profile_vectors WHERE user_id IN ($IDS);
          " >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "Done." >> "$REPORT"

      - name: Commit result to a run-unique branch
        if: always()
        run: |
          git config user.name "neon-delete-stale-bot"
          git config user.email "actions@github.com"
          if [ -f neon-delete-stale-result.txt ]; then
            git add neon-delete-stale-result.txt
            git commit -m "Neon delete stale accounts result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/neon-delete-stale-result-${{ github.run_id }}
          else
            echo "No result file produced."
          fi
