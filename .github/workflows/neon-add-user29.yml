name: Neon add user 29 (local-only real account)

# One-time, re-runnable/idempotent: adds mohammedeidabdelmeguid@gmail.com
# (local id=29 -- confirmed via the reconciliation workflow to be the one
# real user that exists locally but not on Neon; Neon's users are
# 1,3,4,5,6,7,8,9, no collision) plus every dependent row (profile, digest
# settings, saved items, events, follows, rankings, affinities, digest
# click tokens, profile vector).
#
# Only users.id is preserved explicitly (the one thing that actually needs
# to stay 29). Every dependent table gets a fresh auto-generated id --
# nothing outside this user's own data references those ids, so there's no
# reason to risk a collision with an unrelated Neon row that happens to
# share the same surrogate id. content_id references (saved_items,
# user_rankings, user_events, digest_click_tokens) are resolved through
# Neon's own articles/youtube_videos by url, exactly like the bulk content
# sync -- these rows were dumped with url already joined in instead of the
# local numeric id, which would otherwise point at the wrong article.
#
# Every insert is ON CONFLICT DO NOTHING against the real unique
# constraints (users.email, user_profiles.user_id, saved_items'
# (user_id,content_type,content_id), etc.) -- safe to re-run, never
# overwrites, never touches any other user's data.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: yes-add-user29'
        required: true

permissions:
  contents: write

jobs:
  add-user:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes-add-user29" ]; then
            echo "Confirmation input did not match. Aborting without touching Neon."
            exit 1
          fi

      - name: Checkout workflow (main)
        uses: actions/checkout@v4

      - name: Checkout user29 data branch
        uses: actions/checkout@v4
        with:
          ref: neon-user29-data
          path: data-branch

      - name: Install postgresql-client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Pre-flight secret check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is empty. Aborting."
            exit 1
          fi
          echo "DATABASE_URL length: ${#DATABASE_URL}"

      - name: Safety check — confirm id 29 is free and email is unclaimed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          by_id="$(psql "$DATABASE_URL" -tAc "SELECT email FROM users WHERE id=29;")"
          by_email="$(psql "$DATABASE_URL" -tAc "SELECT id FROM users WHERE email='mohammedeidabdelmeguid@gmail.com';")"
          if [ -n "$by_id" ] && [ "$by_id" != "mohammedeidabdelmeguid@gmail.com" ]; then
            echo "users.id=29 already exists on Neon under a DIFFERENT email ($by_id) -- aborting, this would need manual review, not an automatic insert." >&2
            exit 1
          fi
          if [ -n "$by_email" ] && [ "$by_email" != "29" ]; then
            echo "mohammedeidabdelmeguid@gmail.com already exists on Neon under a DIFFERENT id ($by_email) -- aborting." >&2
            exit 1
          fi
          echo "Clear to proceed: id 29 and the target email are consistent (both absent, or both already this exact user from a prior run)."

      - name: Load user 29 and all dependents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          REPORT=neon-add-user29-result.txt
          echo "Neon add user 29 — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          echo "" >> "$REPORT"
          printf '%-24s %10s %10s %10s\n' "table" "before" "after" "inserted" | tee -a "$REPORT"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS staging;"

          load() {
            # $1=name $2=column defs for the staging table $3=file
            name="$1"; coldefs="$2"; file="data-branch/migration_data_user29/$3"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS staging.u29_$name; CREATE TABLE staging.u29_$name ($coldefs);"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\copy staging.u29_$name FROM '$file'"
          }

          report_row() {
            t="$1"; before="$2"
            after=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.$t")
            printf '%-24s %10s %10s %10s\n' "$t" "$before" "$after" "$((after - before))" | tee -a "$REPORT"
          }

          # --- users (id preserved explicitly) ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.users WHERE id=29")
          load users "password varchar(128), last_login timestamptz, is_superuser boolean, first_name varchar(150), last_name varchar(150), is_staff boolean, is_active boolean, date_joined timestamptz, email varchar(254), plan varchar(20), plan_expires_at timestamptz, email_verified boolean" users.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.users (id, password, last_login, is_superuser, first_name, last_name, is_staff, is_active, date_joined, email, plan, plan_expires_at, email_verified)
            SELECT 29, password, last_login, is_superuser, first_name, last_name, is_staff, is_active, date_joined, email, plan, plan_expires_at, email_verified
            FROM staging.u29_users
            ON CONFLICT (id) DO NOTHING;
          "
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT pg_catalog.setval(pg_get_serial_sequence('public.users','id'), GREATEST((SELECT COALESCE(MAX(id),1) FROM public.users), 1), true);"
          report_row users "$before"

          # --- user_profiles (fresh id, user_id=29) ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.user_profiles WHERE user_id=29")
          load user_profiles "onboarding_completed boolean, created_at timestamptz, updated_at timestamptz, bio text" user_profiles.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.user_profiles (onboarding_completed, created_at, updated_at, persona_id, bio, user_id)
            SELECT onboarding_completed, created_at, updated_at, NULL, bio, 29
            FROM staging.u29_user_profiles
            ON CONFLICT (user_id) DO NOTHING;
          "
          report_row user_profiles "$before"

          # --- user_digest_settings (via the profile just inserted/existing) ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.user_digest_settings uds JOIN public.user_profiles up ON up.id=uds.profile_id WHERE up.user_id=29")
          load user_digest_settings "frequency varchar(20), max_items int, is_paused boolean, expertise_level varchar(20), content_depth varchar(20), format_balance varchar(20), reading_time_budget_minutes int, topic_lean varchar(20)" user_digest_settings.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.user_digest_settings (frequency, max_items, is_paused, expertise_level, content_depth, profile_id, format_balance, reading_time_budget_minutes, topic_lean)
            SELECT s.frequency, s.max_items, s.is_paused, s.expertise_level, s.content_depth, (SELECT id FROM public.user_profiles WHERE user_id=29), s.format_balance, s.reading_time_budget_minutes, s.topic_lean
            FROM staging.u29_user_digest_settings s
            ON CONFLICT (profile_id) DO NOTHING;
          "
          report_row user_digest_settings "$before"

          # --- saved_items (content_id resolved via url) ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.saved_items WHERE user_id=29")
          load saved_items "content_type varchar(20), url varchar(2048), is_saved boolean, saved_at timestamptz, is_read boolean, read_at timestamptz, is_hidden boolean, hidden_at timestamptz, created_at timestamptz, updated_at timestamptz" saved_items.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.saved_items (content_type, content_id, is_saved, saved_at, is_read, read_at, is_hidden, hidden_at, created_at, updated_at, user_id)
            SELECT s.content_type, COALESCE(a.id, yv.id), s.is_saved, s.saved_at, s.is_read, s.read_at, s.is_hidden, s.hidden_at, s.created_at, s.updated_at, 29
            FROM staging.u29_saved_items s
            LEFT JOIN public.articles a ON s.content_type='article' AND a.url=s.url
            LEFT JOIN public.youtube_videos yv ON s.content_type='youtube_video' AND yv.url=s.url
            WHERE COALESCE(a.id, yv.id) IS NOT NULL
            ON CONFLICT DO NOTHING;
          "
          report_row saved_items "$before"

          # --- user_events (content optional — NULL content rows pass
          # through). No unique constraint on this table at all, so a
          # plain INSERT would duplicate on every re-run -- guarded with
          # NOT EXISTS instead, keyed on the full natural identity of an
          # event occurrence.
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.user_events WHERE user_id=29")
          load user_events "event_type varchar(20), content_type varchar(20), url varchar(2048), value double precision, created_at timestamptz" user_events.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.user_events (event_type, content_type, content_id, value, created_at, user_id)
            SELECT s.event_type, s.content_type, COALESCE(a.id, yv.id), s.value, s.created_at, 29
            FROM staging.u29_user_events s
            LEFT JOIN public.articles a ON s.content_type='article' AND a.url=s.url
            LEFT JOIN public.youtube_videos yv ON s.content_type='youtube_video' AND yv.url=s.url
            WHERE (s.content_type IS NULL OR COALESCE(a.id, yv.id) IS NOT NULL)
              AND NOT EXISTS (
                SELECT 1 FROM public.user_events ue
                WHERE ue.user_id = 29
                  AND ue.event_type = s.event_type
                  AND ue.created_at = s.created_at
                  AND ue.content_id IS NOT DISTINCT FROM COALESCE(a.id, yv.id)
              );
          "
          report_row user_events "$before"

          # --- user_follows ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.user_follows WHERE user_id=29")
          load user_follows "target_type varchar(20), target_key varchar(200), created_at timestamptz" user_follows.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.user_follows (target_type, target_key, created_at, user_id)
            SELECT target_type, target_key, created_at, 29 FROM staging.u29_user_follows
            ON CONFLICT DO NOTHING;
          "
          report_row user_follows "$before"

          # --- digest_log (no unique constraint either — same NOT EXISTS
          # guard, keyed on (user_id, sent_at)) ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.digest_log WHERE user_id=29")
          load digest_log "sent_at timestamptz" digest_log.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.digest_log (sent_at, user_id)
            SELECT s.sent_at, 29 FROM staging.u29_digest_log s
            WHERE NOT EXISTS (
              SELECT 1 FROM public.digest_log dl WHERE dl.user_id = 29 AND dl.sent_at = s.sent_at
            );
          "
          report_row digest_log "$before"

          # --- user_rankings (content_id resolved via url) ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.user_rankings WHERE user_id=29")
          load user_rankings "content_type varchar(20), url varchar(2048), rank int, relevance_score double precision, reasoning text, computed_at timestamptz, score_version varchar(50), features jsonb" user_rankings.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.user_rankings (user_id, content_type, content_id, rank, relevance_score, reasoning, computed_at, score_version, features)
            SELECT 29, s.content_type, COALESCE(a.id, yv.id), s.rank, s.relevance_score, s.reasoning, s.computed_at, s.score_version, s.features
            FROM staging.u29_user_rankings s
            LEFT JOIN public.articles a ON s.content_type='article' AND a.url=s.url
            LEFT JOIN public.youtube_videos yv ON s.content_type='youtube_video' AND yv.url=s.url
            WHERE COALESCE(a.id, yv.id) IS NOT NULL
            ON CONFLICT DO NOTHING;
          "
          report_row user_rankings "$before"

          # --- user_affinities ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.user_affinities WHERE user_id=29")
          load user_affinities "dimension varchar(20), key varchar(200), weight double precision, updated_at timestamptz" user_affinities.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.user_affinities (user_id, dimension, key, weight, updated_at)
            SELECT 29, dimension, key, weight, updated_at FROM staging.u29_user_affinities
            ON CONFLICT DO NOTHING;
          "
          report_row user_affinities "$before"

          # --- digest_click_tokens (content_id resolved via url) ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.digest_click_tokens WHERE user_id=29")
          load digest_click_tokens "token varchar(32), content_type varchar(20), url varchar(2048), created_at timestamptz" digest_click_tokens.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.digest_click_tokens (token, user_id, content_type, content_id, created_at)
            SELECT s.token, 29, s.content_type, COALESCE(a.id, yv.id), s.created_at
            FROM staging.u29_digest_click_tokens s
            LEFT JOIN public.articles a ON s.content_type='article' AND a.url=s.url
            LEFT JOIN public.youtube_videos yv ON s.content_type='youtube_video' AND yv.url=s.url
            WHERE COALESCE(a.id, yv.id) IS NOT NULL
            ON CONFLICT (token) DO NOTHING;
          "
          report_row digest_click_tokens "$before"

          # --- user_profile_vectors ---
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.user_profile_vectors WHERE user_id=29")
          load user_profile_vectors "vector vector(384), model_name varchar(100), sample_size int, updated_at timestamptz" user_profile_vectors.copy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.user_profile_vectors (user_id, vector, model_name, sample_size, updated_at)
            SELECT 29, vector, model_name, sample_size, updated_at FROM staging.u29_user_profile_vectors
            ON CONFLICT (user_id) DO NOTHING;
          "
          report_row user_profile_vectors "$before"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA staging CASCADE;"

          echo "" >> "$REPORT"
          echo "Done." >> "$REPORT"

      - name: Commit result to a run-unique branch
        if: always()
        run: |
          git config user.name "neon-add-user29-bot"
          git config user.email "actions@github.com"
          if [ -f neon-add-user29-result.txt ]; then
            git add neon-add-user29-result.txt
            git commit -m "Neon add-user29 result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/neon-add-user29-result-${{ github.run_id }}
          else
            echo "No result file produced."
          fi
