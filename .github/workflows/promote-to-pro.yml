name: Promote or downgrade a user's plan (manual, by email)

# Manual admin tool: type an email, pick promote/downgrade, run. Directly
# sets users.plan -- same one field Stripe's own webhook writes
# (apps.accounts.billing.StripeWebhookView), so every existing entitlement
# check (apps.accounts.entitlements.user_can) picks it up with zero other
# changes. plan_expires_at is always cleared to NULL on promote, meaning
# "never expires" (see entitlements.py: an expiry check only fires when
# plan_expires_at IS SET and in the past) -- a manually-granted Pro grant
# is permanent until manually downgraded, not time-boxed.
#
# [Updated after the M17 move off Neon to self-hosted Postgres on AWS EC2]
# Postgres is no longer reachable directly from a GitHub-hosted runner (it's
# only exposed on the EC2 instance's internal Docker network, deliberately
# not on a public port). Instead this SSHes into the EC2 box and runs a
# FORCED COMMAND (~ubuntu/promote_to_pro.sh, restricted via authorized_keys'
# command= directive to a dedicated key that can do nothing else) which
# execs into the postgres container itself. EC2_SSH_KEY/EC2_HOST are new
# secrets; DATABASE_URL is no longer used by this workflow.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Account email to update"
        required: true
        type: string
      action:
        description: "What to do"
        required: true
        type: choice
        options: [promote_to_pro, downgrade_to_free]
        default: promote_to_pro

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update plan (over SSH, forced command on the EC2 box)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EMAIL: ${{ github.event.inputs.email }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          REPORT=promote-to-pro-result.txt
          echo "Plan update — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          echo "email: $EMAIL" >> "$REPORT"
          echo "action: $ACTION" >> "$REPORT"
          echo "" >> "$REPORT"

          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The forced command on the server side ignores anything except
          # the literal "<email> <action>" string here -- see
          # promote_to_pro.sh's own comment for what it actually runs.
          # PIPESTATUS[0] (ssh's own exit code), not tee's, decides pass/fail
          # -- otherwise a "user not found" (ssh exits 1) would still read
          # as a green run, since tee itself always exits 0.
          set +e
          ssh -i ~/.ssh/id_ed25519 "ubuntu@$EC2_HOST" "$EMAIL $ACTION" | tee -a "$REPORT"
          SSH_STATUS=${PIPESTATUS[0]}
          set -e
          cat "$REPORT"
          exit "$SSH_STATUS"

      - name: Commit result to a run-unique branch
        if: always()
        run: |
          git config user.name "promote-to-pro-bot"
          git config user.email "actions@github.com"
          if [ -f promote-to-pro-result.txt ]; then
            git add promote-to-pro-result.txt
            git commit -m "Plan update result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/promote-to-pro-result-${{ github.run_id }}
          else
            echo "No result file produced."
          fi
