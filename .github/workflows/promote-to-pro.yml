name: Promote or downgrade a user's plan (manual, by email)

# Manual admin tool: type an email, pick promote/downgrade, run. Directly
# sets users.plan on Neon -- same one field Stripe's own webhook writes
# (apps.accounts.billing.StripeWebhookView), so every existing entitlement
# check (apps.accounts.entitlements.user_can) picks it up with zero other
# changes. plan_expires_at is always cleared to NULL on promote, meaning
# "never expires" (see entitlements.py: an expiry check only fires when
# plan_expires_at IS SET and in the past) -- a manually-granted Pro grant
# is permanent until manually downgraded, not time-boxed.
#
# Mirrors this repo's existing one-off-account-op pattern (see
# neon-verify-user29.yml / neon-add-user29.yml): workflow_dispatch only,
# psql + DATABASE_URL secret, no new dependencies.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Account email to update"
        required: true
        type: string
      action:
        description: "What to do"
        required: true
        type: choice
        options: [promote_to_pro, downgrade_to_free]
        default: promote_to_pro

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Update plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL: ${{ github.event.inputs.email }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          REPORT=promote-to-pro-result.txt
          echo "Plan update — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          echo "email: $EMAIL" >> "$REPORT"
          echo "action: $ACTION" >> "$REPORT"
          echo "" >> "$REPORT"

          exists=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM users WHERE lower(email)=lower('$EMAIL');")
          if [ "$exists" -eq 0 ]; then
            echo "No user found with this email. Nothing changed." | tee -a "$REPORT"
            exit 1
          fi

          if [ "$ACTION" = "promote_to_pro" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE users SET plan='pro', plan_expires_at=NULL
              WHERE lower(email)=lower('$EMAIL');
            "
          else
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE users SET plan='free', plan_expires_at=NULL
              WHERE lower(email)=lower('$EMAIL');
            "
          fi

          echo "=== resulting row ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "SELECT id, email, plan, plan_expires_at FROM users WHERE lower(email)=lower('$EMAIL');" >> "$REPORT" 2>&1
          cat "$REPORT"

      - name: Commit result to a run-unique branch
        if: always()
        run: |
          git config user.name "promote-to-pro-bot"
          git config user.email "actions@github.com"
          if [ -f promote-to-pro-result.txt ]; then
            git add promote-to-pro-result.txt
            git commit -m "Plan update result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/promote-to-pro-result-${{ github.run_id }}
          else
            echo "No result file produced."
          fi
