name: Neon content sync (local -> Neon, additive-only)

# One-time (re-runnable/idempotent) migration: loads the pipeline content
# tables dumped from local Postgres into Neon. Every table has a natural-key
# unique constraint (url, content_type+content_id, name+entity_type, etc.)
# in addition to its numeric id, so every insert uses
# `ON CONFLICT DO NOTHING` against a staging copy of the real table —
# existing Neon rows are never touched, never overwritten, never deleted.
# Source dumps live on the `neon-content-sync-data` branch (not main) since
# they're a ~124MB one-time data artifact, not application code.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: yes-sync-neon'
        required: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes-sync-neon" ]; then
            echo "Confirmation input did not match. Aborting without touching Neon."
            exit 1
          fi

      - name: Checkout workflow (main)
        uses: actions/checkout@v4

      - name: Checkout dump data branch
        uses: actions/checkout@v4
        with:
          ref: neon-content-sync-data
          path: data-branch

      - name: Install postgresql-client 16 (match local dump version)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Pre-flight secret check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is empty. Aborting."
            exit 1
          fi
          echo "DATABASE_URL length: ${#DATABASE_URL}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv and pipeline dependencies
        run: |
          pip install uv
          uv sync --frozen --no-dev

      - name: Ensure Neon schema is current (CREATE TABLE IF NOT EXISTS only)
        # A previous run hit "relation public.rag_chunks does not exist" —
        # Neon's schema was bootstrapped by this same script before the
        # RagChunk model existed, and nothing re-ran it since. This calls
        # the project's own create_tables.py (app/database/create_tables.py),
        # already documented as "safe to re-run, CREATE TABLE IF NOT EXISTS
        # under the hood" — it only adds tables/the pgvector extension that
        # are missing, and stamps Alembic head; it never touches existing
        # tables or data.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m app.database.create_tables

      - name: Verify taxonomy_topics id alignment (read-only)
        # content_topics.taxonomy_topic_id is a plain FK by numeric id (no
        # natural-key remap like entities gets below), which is only safe
        # if local and Neon assigned taxonomy_topics the same ids for the
        # same slugs (expected: both seeded by the same fixed Django data
        # migration, onboarding/0004_link_taxonomy_topics, and both already
        # have matching row counts of 27). This step proves it instead of
        # assuming it, and aborts before anything is written if it's wrong.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          expected="1|large-language-models,2|ai-agents,3|open-source-models,4|nlp,5|ml-research,6|rag-vector-databases,7|computer-vision,8|reinforcement-learning,9|ai-safety,10|ai-policy,11|robotics,12|mlops,13|startups-funding,14|developer-tools,15|multimodal-ai,16|model-releases,17|benchmarks-evaluation,18|ai-hardware-chips,19|cloud-ai-infrastructure,20|enterprise-ai,21|generative-media,22|coding-assistants,23|ai-in-science,24|data-privacy-security,25|open-source-tooling,26|ai-education,27|industry-news-general"
          actual="$(psql "$DATABASE_URL" -tAc "SELECT id||'|'||slug FROM taxonomy_topics ORDER BY id;" | paste -sd, -)"
          if [ "$expected" != "$actual" ]; then
            echo "taxonomy_topics id/slug mismatch between local and Neon — aborting before any write." >&2
            echo "expected: $expected" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi
          echo "taxonomy_topics ids confirmed aligned (27/27)."

      - name: Sync tables (FK-safe order, additive-only merge)
        # IMPORTANT — id remapping: articles/youtube_videos/entities are
        # the only tables with a natural key that local and Neon could
        # have assigned DIFFERENT numeric ids to (Neon already has its own
        # 3,444 articles / 123 videos / 5,809 entities from its own
        # pipeline runs). Every other table below references content via
        # a polymorphic (content_type, content_id) pair — or, for
        # content_entities/person_entities, entity_id — with NO real FK
        # constraint enforcing it. Copying those numeric ids verbatim
        # would not error, it would silently point rows at the WRONG
        # article/video/entity (or a nonexistent one) whenever a local
        # row's parent was skipped by ON CONFLICT DO NOTHING in favor of
        # Neon's pre-existing copy. So every child merge below re-resolves
        # content_id/entity_id through the parent's natural key (url /
        # name+entity_type) via the parent's staging table, which still
        # holds local's raw ids and is kept alive until every child that
        # needs it has been merged.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          REPORT=neon-content-sync-result.txt
          echo "Neon content sync — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          echo "" >> "$REPORT"
          printf '%-26s %10s %10s %10s\n' "table" "before" "after" "inserted" | tee -a "$REPORT"

          restore_to_staging() {
            # Converts a per-table custom-format dump into plain SQL and
            # redirects the COPY target from public.<t> to staging.<t>.
            # Only the COPY header line (anchored at line start) is
            # touched — data rows never start with "COPY ", so this can't
            # corrupt embedded newlines in text columns.
            t="$1"
            dump="data-branch/migration_data/$t.dump"
            if [ ! -f "$dump" ]; then
              echo "Missing dump for $t, aborting." | tee -a "$REPORT"
              exit 1
            fi
            sql="/tmp/$t.sql"
            pg_restore -f "$sql" "$dump"
            sed -i \
              -e "s/^COPY public\.$t /COPY staging.$t /" \
              -e '/^\\restrict /d' \
              -e '/^\\unrestrict /d' \
              "$sql"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS staging.$t; CREATE TABLE staging.$t (LIKE public.$t);"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$sql"
          }

          reset_sequence() {
            t="$1"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT pg_catalog.setval(pg_get_serial_sequence('public.$t','id'), GREATEST((SELECT COALESCE(MAX(id),1) FROM public.$t), 1), true);"
          }

          report_row() {
            t="$1"; before="$2"
            after=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.$t")
            printf '%-26s %10s %10s %10s\n' "$t" "$before" "$after" "$((after - before))" | tee -a "$REPORT"
          }

          # Frees a staging table's storage the moment it's no longer
          # needed, instead of letting all 16 pile up simultaneously until
          # the very end — Neon's free tier caps total project storage at
          # 512MB, and a prior run hit that cap partway through precisely
          # because every staging table (including a ~78MB rag_chunks
          # copy) was still sitting there when later tables tried to
          # insert. entities/articles/youtube_videos are the exception:
          # their staging copies are the remap join source for every
          # child table and stay alive until drop_anchor_staging runs.
          drop_staging() {
            t="$1"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS staging.$t;"
          }

          # Plain passthrough merge: no id remap needed, either because
          # the table has no natural key besides id and nothing else
          # references it by a value that could drift (content_clusters),
          # or the table itself IS a natural-key anchor being inserted
          # as-is (entities, articles, youtube_videos — their own id is
          # simply whatever wins the ON CONFLICT race), or there's no
          # content reference at all (trends, trend_reports). $2=keep
          # ("keep" to leave the staging table alive for later remap
          # joins, anything else/omitted to drop it immediately).
          plain_merge() {
            t="$1"; keep="${2:-}"
            before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.$t")
            restore_to_staging "$t"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.$t SELECT * FROM staging.$t ON CONFLICT DO NOTHING;"
            reset_sequence "$t"
            report_row "$t" "$before"
            [ "$keep" = "keep" ] || drop_staging "$t"
          }

          # Polymorphic child merge: resolves content_id through
          # staging.articles/staging.youtube_videos (local's raw ids) ->
          # public.articles/public.youtube_videos (by url) so the
          # inserted row always points at the correct Neon-side parent,
          # regardless of whether that parent kept its local id or was
          # already present in Neon under a different one. Rows whose
          # parent can't be resolved (shouldn't happen; articles/videos
          # are synced first) are skipped, not inserted with a dangling
          # reference.
          merge_polymorphic() {
            t="$1"; insert_cols="$2"; select_cols="$3"
            before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.$t")
            restore_to_staging "$t"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              INSERT INTO public.$t ($insert_cols)
              SELECT $select_cols
              FROM staging.$t s
              LEFT JOIN staging.articles la ON s.content_type='article' AND la.id = s.content_id
              LEFT JOIN public.articles pa ON pa.url = la.url
              LEFT JOIN staging.youtube_videos lv ON s.content_type='youtube_video' AND lv.id = s.content_id
              LEFT JOIN public.youtube_videos pv ON pv.url = lv.url
              WHERE COALESCE(pa.id, pv.id) IS NOT NULL
              ON CONFLICT DO NOTHING;
            "
            reset_sequence "$t"
            report_row "$t" "$before"
            drop_staging "$t"
          }

          echo "DB size before this run:" >> "$REPORT"
          psql "$DATABASE_URL" -tAc "SELECT pg_size_pretty(pg_database_size(current_database()));" >> "$REPORT"

          # Force a clean slate: a prior failed run can leave orphaned
          # staging tables behind (e.g. a 251,750-row staging.trends from
          # the run that hit the storage cap mid-insert) that would
          # otherwise sit there wasting space for the rest of this run too.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS staging CASCADE; CREATE SCHEMA staging;"
          echo "DB size after clearing any leftover staging schema:" >> "$REPORT"
          psql "$DATABASE_URL" -tAc "SELECT pg_size_pretty(pg_database_size(current_database()));" >> "$REPORT"

          # 1) Natural-key anchors — staging kept alive ("keep") for every
          # child merge below, dropped together once nothing needs them
          # anymore (see drop_anchor_staging near the end).
          plain_merge entities keep
          plain_merge content_clusters
          plain_merge articles keep
          plain_merge youtube_videos keep

          # 2) Children needing only the content_id (article/video) remap.
          # taxonomy_topic_id (content_topics) and cluster_id
          # (content_cluster_members) are passed through as-is — both
          # already verified/argued safe above.
          merge_polymorphic content_topics \
            "content_type, content_id, taxonomy_topic_id, confidence, created_at" \
            "s.content_type, COALESCE(pa.id, pv.id), s.taxonomy_topic_id, s.confidence, s.created_at"

          merge_polymorphic content_cluster_members \
            "content_type, content_id, cluster_id, similarity_to_centroid, created_at" \
            "s.content_type, COALESCE(pa.id, pv.id), s.cluster_id, s.similarity_to_centroid, s.created_at"

          merge_polymorphic embeddings \
            "content_type, content_id, embedding, model_name, created_at" \
            "s.content_type, COALESCE(pa.id, pv.id), s.embedding, s.model_name, s.created_at"

          merge_polymorphic content_enrichment \
            "content_type, content_id, content_category, technical_depth, key_points, technical_details, business_angle, why_it_matters, enrichment_version, enriched_at" \
            "s.content_type, COALESCE(pa.id, pv.id), s.content_category, s.technical_depth, s.key_points, s.technical_details, s.business_angle, s.why_it_matters, s.enrichment_version, s.enriched_at"

          merge_polymorphic content_scores \
            "content_type, content_id, score, score_version, features, computed_at" \
            "s.content_type, COALESCE(pa.id, pv.id), s.score, s.score_version, s.features, s.computed_at"

          merge_polymorphic content_chunks \
            "content_type, content_id, chunk_index, start_seconds, end_seconds, chapter_title, chunk_summary, summary_version, created_at" \
            "s.content_type, COALESCE(pa.id, pv.id), s.chunk_index, s.start_seconds, s.end_seconds, s.chapter_title, s.chunk_summary, s.summary_version, s.created_at"

          merge_polymorphic rag_chunks \
            "content_type, content_id, chunk_index, text, char_start, char_end, start_seconds, end_seconds, token_count, embedding, index_version, created_at" \
            "s.content_type, COALESCE(pa.id, pv.id), s.chunk_index, s.text, s.char_start, s.char_end, s.start_seconds, s.end_seconds, s.token_count, s.embedding, s.index_version, s.created_at"

          merge_polymorphic stt_jobs \
            "content_type, content_id, status, transcript_source, whisper_model, error_message, requested_at, started_at, completed_at, retry_count" \
            "s.content_type, COALESCE(pa.id, pv.id), s.status, s.transcript_source, s.whisper_model, s.error_message, s.requested_at, s.started_at, s.completed_at, s.retry_count"

          # 3) content_entities needs BOTH the content_id remap (via
          # articles/youtube_videos, same as above) AND the entity_id
          # remap (via entities' natural key name+entity_type — Neon's
          # 5,809 pre-existing entities make this the same risk as the
          # content_id case).
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.content_entities")
          restore_to_staging content_entities
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.content_entities (content_type, content_id, entity_id, mention_context, created_at)
            SELECT s.content_type, COALESCE(pa.id, pv.id), e.id, s.mention_context, s.created_at
            FROM staging.content_entities s
            LEFT JOIN staging.articles la ON s.content_type='article' AND la.id = s.content_id
            LEFT JOIN public.articles pa ON pa.url = la.url
            LEFT JOIN staging.youtube_videos lv ON s.content_type='youtube_video' AND lv.id = s.content_id
            LEFT JOIN public.youtube_videos pv ON pv.url = lv.url
            JOIN staging.entities le ON le.id = s.entity_id
            JOIN public.entities e ON e.name = le.name AND e.entity_type = le.entity_type
            WHERE COALESCE(pa.id, pv.id) IS NOT NULL
            ON CONFLICT DO NOTHING;
          "
          reset_sequence content_entities
          report_row content_entities "$before"
          drop_staging content_entities

          # person_entities: entity_id remap only (no content reference).
          # 0 rows locally today, handled correctly regardless.
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.person_entities")
          restore_to_staging person_entities
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.person_entities (entity_id, footprint_type, source_id, external_identifier, created_at)
            SELECT e.id, s.footprint_type, s.source_id, s.external_identifier, s.created_at
            FROM staging.person_entities s
            JOIN staging.entities le ON le.id = s.entity_id
            JOIN public.entities e ON e.name = le.name AND e.entity_type = le.entity_type
            ON CONFLICT DO NOTHING;
          "
          reset_sequence person_entities
          report_row person_entities "$before"
          drop_staging person_entities

          # 4) No content/entity reference at all — plain passthrough.
          plain_merge trends
          plain_merge trend_reports

          # Drops the three anchor staging tables (entities, articles,
          # youtube_videos) kept alive until now for remap joins, plus the
          # now-empty schema itself.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA staging CASCADE;"

          echo "" >> "$REPORT"
          echo "DB size after this run:" >> "$REPORT"
          psql "$DATABASE_URL" -tAc "SELECT pg_size_pretty(pg_database_size(current_database()));" >> "$REPORT"
          echo "Sync complete." >> "$REPORT"

      - name: Commit result to a run-unique branch
        # Pushes to its own branch (never a shared one) so it can't race
        # any other workflow's commit — same fix as the reconciliation and
        # backup workflows needed after two prior race-condition failures.
        if: always()
        run: |
          git config user.name "neon-content-sync-bot"
          git config user.email "actions@github.com"
          if [ -f neon-content-sync-result.txt ]; then
            git add neon-content-sync-result.txt
            git commit -m "Neon content sync result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/neon-content-sync-result-${{ github.run_id }}
          else
            echo "No result file produced (failed before any report was written)."
          fi
