name: Throwaway - Neon read-only reconciliation check

# TEMPORARY, ONE-OFF workflow. Runs only SELECT/COUNT queries against Neon
# (no INSERT/UPDATE/DELETE/DDL of any kind) to compare row counts against
# local dev for the production-readiness audit. Safe to delete this file and
# its branch once the counts have been read.
#
# Exists only because this developer machine's outbound network blocks
# Postgres wire-protocol (port 5432) to external hosts -- GitHub-hosted
# runners have normal outbound access.
#
# Writes results to neon-reconciliation-result.txt and commits it back to
# THIS branch (Actions log download needs an admin-scoped token that isn't
# available where these results get read; a plain git pull already works).
# The commit step runs with `if: always()` so a mid-run query failure
# (e.g. a table that exists locally but hasn't been migrated to Neon yet --
# itself a real, useful reconciliation finding) still leaves the partial
# results readable instead of silently discarding them, which is exactly
# what happened on the previous attempt.
#
# Every psql call below is individually fault-tolerant (`|| echo ... `) so
# ONE missing table can never abort the rest of the diagnostic under GitHub
# Actions' default bash -e behavior for `run:` steps.
#
# SECRET SAFETY: never prints $DATABASE_URL, never enables shell tracing.

on:
  push:
    branches:
      - chore/neon-readonly-check

permissions:
  contents: write

jobs:
  check-neon-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Init results file
        run: echo "Neon reconciliation - $(date -u)" > neon-reconciliation-result.txt

      - name: Verify DATABASE_URL secret is actually configured (value never printed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is EMPTY or not set." >> neon-reconciliation-result.txt
            exit 1
          fi
          echo "DATABASE_URL is set (length: ${#DATABASE_URL} chars, value not printed)." >> neon-reconciliation-result.txt

      - name: Test connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          echo -e "\n=== Connection test ===" >> neon-reconciliation-result.txt
          if psql "$DATABASE_URL" -c "SELECT 1;" > /dev/null 2>>neon-reconciliation-result.txt; then
            echo "SUCCESS" >> neon-reconciliation-result.txt
          else
            echo "FAILED" >> neon-reconciliation-result.txt
            exit 1
          fi

      - name: Schema / migration status
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          echo -e "\n=== Django migrations (last 10) ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT app, name, applied FROM django_migrations ORDER BY id DESC LIMIT 10;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt

          echo -e "\n=== Alembic version (pipeline schema) ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT version_num FROM alembic_version;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt

          echo -e "\n=== pgvector extension ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT extname, extversion FROM pg_extension WHERE extname='vector';" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt

      - name: Full table list
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          echo -e "\n=== Full table list ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt

      - name: Row counts (each table independently fault-tolerant)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          echo -e "\n=== Row counts ===" >> neon-reconciliation-result.txt
          for t in articles youtube_videos embeddings content_enrichment content_chunks sources \
                   taxonomy_topics entities content_clusters content_scores trends trend_reports \
                   stt_jobs users user_profiles user_events user_interests user_exclusions \
                   user_source_subscriptions user_digest_settings saved_items user_follows \
                   user_rankings digest_log user_affinities terms_acceptances; do
            result=$(psql "$DATABASE_URL" -t -c "SELECT count(*) FROM $t;" 2>&1)
            if [ $? -eq 0 ]; then
              echo "$t: $(echo $result | xargs)" >> neon-reconciliation-result.txt
            else
              echo "$t: TABLE NOT FOUND / QUERY FAILED" >> neon-reconciliation-result.txt
            fi
          done

      - name: Freshness signals
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          echo -e "\n=== Freshness signals ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT max(id) AS max_id, max(published_at) AS newest FROM articles;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT max(id) AS max_id, max(published_at) AS newest FROM youtube_videos;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT max(id) AS max_id, count(*) AS total, max(date_joined) AS newest_signup FROM users;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT max(id) AS max_id, max(created_at) AS newest FROM user_events;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT max(id) AS max_id FROM embeddings;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt
          echo -e "\n=== trend_reports detail ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT id, week_start_date, llm_model, generated_at FROM trend_reports ORDER BY week_start_date;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt

      - name: User diff (id/email/plan/staff/joined only -- no password hashes)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          echo -e "\n=== Full user list (Neon) ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "SELECT id, email, plan, is_staff, is_active, date_joined FROM users ORDER BY id;" >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt
          echo -e "\n=== user_profiles / interests / exclusions / digest_settings counts per user ===" >> neon-reconciliation-result.txt
          psql "$DATABASE_URL" -c "
            SELECT u.id, u.email,
              (SELECT count(*) FROM user_interests ui JOIN user_profiles up ON up.id=ui.profile_id WHERE up.user_id=u.id) AS interests,
              (SELECT count(*) FROM user_exclusions ue JOIN user_profiles up ON up.id=ue.profile_id WHERE up.user_id=u.id) AS exclusions
            FROM users u ORDER BY u.id;
          " >> neon-reconciliation-result.txt 2>&1 || echo "(query failed)" >> neon-reconciliation-result.txt

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "neon-reconciliation-bot"
          git config user.email "actions@github.com"
          git add neon-reconciliation-result.txt
          git commit -m "Neon reconciliation results $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push
