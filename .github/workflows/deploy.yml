name: Deploy (SSH + Docker Compose — Oracle or AWS EC2 backend)

# Cloud-agnostic: plain SSH + `git pull` + `docker compose up -d --build`
# against docker-compose.prod.yml, so this works unchanged whether
# DEPLOY_HOST points at an Oracle Cloud VM or an AWS EC2 instance (see
# docs/DEPLOYMENT.md's Section 3 vs 3c — same compose file either way,
# frontend now deploys separately to Vercel). If you're on the Render
# fallback path instead, Render's own native "auto-deploy on push"
# replaces this entirely -- delete or disable this workflow.
#
# Required repo secrets:
#   DEPLOY_HOST       - the instance's public IP or hostname
#   DEPLOY_USER       - SSH user on the instance (e.g. "ubuntu" on AWS EC2)
#   DEPLOY_SSH_KEY    - private key for that user (public key installed on the instance;
#                       on AWS this is the .pem file's contents from the EC2 key pair)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ai-news-aggregator
            git pull
            docker compose -f docker/docker-compose.prod.yml up -d --build
