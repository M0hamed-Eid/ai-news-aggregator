name: Neon database health check (read-only)

# Manual, read-only diagnostic for the production QA pass (2026-08-10) --
# Neon's free tier caps total storage at 512MB and this project has
# repeatedly hit it (see neon-prune-old-content.yml). This reports size,
# per-table/index breakdown, row counts, and connection stats so storage
# headroom and any unexpected growth can be assessed BEFORE deciding
# whether any cleanup is needed -- makes zero changes to the database.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Run health check queries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          REPORT=neon-health-check-result.txt
          echo "Neon database health check — $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          echo "" >> "$REPORT"

          echo "=== Overall database size ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "SELECT pg_size_pretty(pg_database_size(current_database())) AS total_size, pg_database_size(current_database()) AS bytes;" >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Top 25 tables by total size (table + indexes + toast) ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "
            SELECT
              relname AS table_name,
              pg_size_pretty(pg_total_relation_size(c.oid)) AS total_size,
              pg_size_pretty(pg_relation_size(c.oid)) AS table_size,
              pg_size_pretty(pg_total_relation_size(c.oid) - pg_relation_size(c.oid)) AS indexes_toast_size
            FROM pg_class c
            LEFT JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r' AND n.nspname = 'public'
            ORDER BY pg_total_relation_size(c.oid) DESC
            LIMIT 25;
          " >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Top 15 largest individual indexes ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "
            SELECT
              indexrelname AS index_name,
              relname AS table_name,
              pg_size_pretty(pg_relation_size(indexrelid)) AS index_size
            FROM pg_stat_user_indexes
            ORDER BY pg_relation_size(indexrelid) DESC
            LIMIT 15;
          " >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Row counts, major content/vector tables ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "
            SELECT 'articles' t, count(*) FROM articles
            UNION ALL SELECT 'youtube_videos', count(*) FROM youtube_videos
            UNION ALL SELECT 'embeddings', count(*) FROM embeddings
            UNION ALL SELECT 'rag_chunks', count(*) FROM rag_chunks
            UNION ALL SELECT 'content_chunks', count(*) FROM content_chunks
            UNION ALL SELECT 'content_enrichment', count(*) FROM content_enrichment
            UNION ALL SELECT 'content_scores', count(*) FROM content_scores
            UNION ALL SELECT 'content_topics', count(*) FROM content_topics
            UNION ALL SELECT 'content_entities', count(*) FROM content_entities
            UNION ALL SELECT 'content_cluster_members', count(*) FROM content_cluster_members
            UNION ALL SELECT 'user_events', count(*) FROM user_events
            UNION ALL SELECT 'user_rankings', count(*) FROM user_rankings
            UNION ALL SELECT 'saved_items', count(*) FROM saved_items
            UNION ALL SELECT 'digest_click_tokens', count(*) FROM digest_click_tokens
            UNION ALL SELECT 'users', count(*) FROM users
            ORDER BY 1;
          " >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== pgvector extension + vector column info ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';" >> "$REPORT" 2>&1
          psql "$DATABASE_URL" -c "
            SELECT table_name, column_name, udt_name
            FROM information_schema.columns
            WHERE udt_name = 'vector';
          " >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Oldest and newest content (staleness check) ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "
            SELECT 'articles' t, min(published_at) oldest, max(published_at) newest FROM articles
            UNION ALL
            SELECT 'youtube_videos', min(published_at), max(published_at) FROM youtube_videos;
          " >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Active connections (current query's own connection excluded) ===" >> "$REPORT"
          psql "$DATABASE_URL" -c "
            SELECT count(*) AS active_connections, state
            FROM pg_stat_activity
            WHERE datname = current_database()
            GROUP BY state;
          " >> "$REPORT" 2>&1

          echo "" >> "$REPORT"
          echo "=== Neon free tier limits, for reference ===" >> "$REPORT"
          echo "512 MB storage cap. neon-prune-old-content.yml auto-prunes when over 450MB." >> "$REPORT"

          cat "$REPORT"

      - name: Commit result to a run-unique branch
        if: always()
        run: |
          git config user.name "neon-health-check-bot"
          git config user.email "actions@github.com"
          if [ -f neon-health-check-result.txt ]; then
            git add neon-health-check-result.txt
            git commit -m "Neon health check result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:refs/heads/neon-health-check-result-${{ github.run_id }}
          else
            echo "No result file produced."
          fi
