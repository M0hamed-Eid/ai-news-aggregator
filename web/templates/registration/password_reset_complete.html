{% extends "base.html" %}
{% block title %}Password reset · AI Compass{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <i class="bi bi-check-circle display-4 text-success mb-3"></i>
        <h1 class="h4 mb-2">Password updated</h1>
        <p class="text-muted mb-3">Your password has been changed successfully.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
