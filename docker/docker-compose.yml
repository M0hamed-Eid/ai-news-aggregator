version: "3.9"

# =============================================================================
# AI News Aggregator — Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up -d        # start
#   docker compose -f docker/docker-compose.yml down         # stop
#   docker compose -f docker/docker-compose.yml down -v      # stop + wipe volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — primary data store
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_news_db

    # Restart automatically unless you explicitly stop the container.
    # Useful for dev machines that reboot and production servers.
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_news}
      POSTGRES_USER: ${POSTGRES_USER:-ai_news_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      # DEV ONLY: trust auth — allow connections without a valid password so
      # local dev never gets blocked on password mismatches. Do NOT use in prod.
      POSTGRES_HOST_AUTH_METHOD: trust
      # Tune connection settings for a lightweight dev container.
      # In production, use PgBouncer or an RDS parameter group instead.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    ports:
      # HOST:CONTAINER — host port 5433 (hardcoded, not from .env) because a
      # native Windows PostgreSQL service already owns host port 5432 and
      # shadows this container. The DB still listens on 5432 inside the container.
      - "5433:5432"

    volumes:
      # Named volume — data survives container restarts and rebuilds.
      - postgres_data:/var/lib/postgresql/data
      # Mount init scripts — Postgres runs *.sql / *.sh files in alphabetical
      # order the FIRST TIME the volume is created (i.e. when the DB is brand new).
      - ./init:/docker-entrypoint-initdb.d

    healthcheck:
      # pg_isready exits 0 when the server is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_news_user} -d ${POSTGRES_DB:-ai_news}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Redis — Celery broker + result backend (M6: background job queue).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_news_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Celery — default worker for scheduled/local pipeline jobs.
  # Consumes the default queue used by run_full_pipeline_task and ranking jobs.
  # ---------------------------------------------------------------------------
  worker-default:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai_news_worker_default
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ai_news_user}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-ai_news}
      REDIS_URL: redis://redis:6379/0
      DJANGO_BASE_URL: ${DJANGO_BASE_URL:-http://host.docker.internal:8000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      HOURS_LOOKBACK: ${HOURS_LOOKBACK:-144}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LOCAL_SIMPLE_MODEL: ${LOCAL_SIMPLE_MODEL:-llama3.1:8b}
      WHISPER_MODEL: ${WHISPER_MODEL:-distil-large-v3}
      RESIDENTIAL_PROXY_URL: ${RESIDENTIAL_PROXY_URL:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Celery — STT worker for video transcription jobs dispatched by the pipeline.
  # Kept on its dedicated queue so CPU-heavy transcription never blocks batch jobs.
  # ---------------------------------------------------------------------------
  worker-stt:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai_news_worker_stt
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "app.celery_app:celery_app", "worker", "--pool=solo", "--loglevel=info", "-Q", "stt", "-n", "stt-worker@%h"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ai_news_user}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-ai_news}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WHISPER_MODEL: ${WHISPER_MODEL:-distil-large-v3}
      RESIDENTIAL_PROXY_URL: ${RESIDENTIAL_PROXY_URL:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Celery beat — local scheduler. Starts automatically with Compose and fires
  # the code-defined schedules in app/celery_app.py, including every-6h pipeline.
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai_news_beat
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ai_news_user}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-ai_news}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      HOURS_LOOKBACK: ${HOURS_LOOKBACK:-144}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LOCAL_SIMPLE_MODEL: ${LOCAL_SIMPLE_MODEL:-llama3.1:8b}
      WHISPER_MODEL: ${WHISPER_MODEL:-distil-large-v3}
      RESIDENTIAL_PROXY_URL: ${RESIDENTIAL_PROXY_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — optional web UI for browsing the DB during development.
  # Remove this service (or comment it out) before deploying to production.
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai_news_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"        # skip login page in dev
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "${PGADMIN_PORT:-5050}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

# =============================================================================
# Named volumes — managed by Docker, persist across container restarts.
# =============================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local
  hf_cache:
    driver: local

# =============================================================================
# Networks — isolates the backend services from other containers on the host.
# =============================================================================
networks:
  backend:
    driver: bridge